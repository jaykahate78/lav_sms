services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:10000"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      SESSION_SECURE_COOKIE: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: lavsms_demo
      DB_USERNAME: lavsms_demo
      DB_SSLMODE: prefer
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lavsms_demo
      POSTGRES_USER: lavsms_demo
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavsms_demo -d lavsms_demo"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
