# Example Blueprint for a new web service. Existing Render 'lav_sms' is configured directly.
# Neon database project: lavsms-school-demo (not managed by Render).
services:
  - type: web
    name: lavsms-school-demo
    runtime: docker
    plan: free
    region: singapore
    branch: deploy/render-school-demo
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: Village School Demo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: sync
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_SEED_PASSWORD
        sync: false
